[package]
name = "l2toolbox-gui"
version = "0.1.0"
edition = "2024"
authors = ["Maciej Karpiński"]
license = "GPL-3.0"
readme = "README.md"

[dependencies]
l2toolbox-core = { path = "../l2toolbox-core" }
iced = "0.14.0"
directories = "6.0.0"
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
chrono = "0.4.45"
fluent = "0.17.0"
unic-langid ={version = "0.9.6",features = ["unic-langid-macros", "serde"]}
rfd = "0.17.2"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"